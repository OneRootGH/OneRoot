<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OneRoot Essentials Icon</title>
  <desc id="desc">The OneRoot Essentials logo on a transparent background.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17392c" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#3f8f60" flood-opacity="0.18" />
    </filter>
  </defs>
  <image
    href="/assets/oneroot-logo.png"
    x="26"
    y="92"
    width="460"
    height="328"
    preserveAspectRatio="xMidYMid meet"
    filter="url(#shadow)"
  />
</svg>
