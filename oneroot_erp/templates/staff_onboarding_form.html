{% extends "base.html" %}
{% block content %}
<section class="page-intro"><div><p class="eyebrow">People</p><h3>Staff Onboarding</h3><p class="muted">Capture a staff member once. OneRoot will prepare the core employment-document register and a completed printable pack.</p></div><a class="button subtle" href="{{ url_for('module_list', module_key='staff_documents') }}">Back to Staff Documents</a></section>
<form method="post" class="form-grid module-form-grid"><label><span>Staff Full Name</span><input name="staffName" required value="{{ payload.get('staffName','') }}"></label><label><span>Staff Role</span><select name="staffRole" required><option value="">Select role</option>{% for value,label in staff_role_options %}<option value="{{ value }}" {% if payload.get('staffRole')==value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label><span>Phone</span><input name="phone" value="{{ payload.get('phone','') }}"></label><label><span>Email</span><input type="email" name="email" value="{{ payload.get('email','') }}"></label><label><span>Ghana Card / ID</span><input name="ghanaCard" value="{{ payload.get('ghanaCard','') }}"></label><label><span>Home Address</span><input name="address" value="{{ payload.get('address','') }}"></label><label><span>Emergency Contact Name</span><input name="emergencyContact" value="{{ payload.get('emergencyContact','') }}"></label><label><span>Emergency Contact Phone</span><input name="emergencyPhone" value="{{ payload.get('emergencyPhone','') }}"></label><label><span>Start Date</span><input type="date" name="startDate" value="{{ payload.get('startDate','') }}"></label><label><span>Employment Type</span><select name="employmentType"><option {% if payload.get('employmentType')=='Full-Time' %}selected{% endif %}>Full-Time</option><option {% if payload.get('employmentType')=='Part-Time' %}selected{% endif %}>Part-Time</option><option {% if payload.get('employmentType')=='Contract' %}selected{% endif %}>Contract</option></select></label><label><span>Monthly Salary (GH₵)</span><input type="number" step="0.01" min="0" name="monthlySalary" value="{{ payload.get('monthlySalary','') }}"></label><label><span>Supervisor</span><input name="supervisor" value="{{ payload.get('supervisor','') }}"></label><div class="form-actions span-2"><button class="button primary" type="submit">Create Completed Staff Pack</button></div></form>
{% endblock %}
