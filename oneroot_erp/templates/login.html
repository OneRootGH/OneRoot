<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#204d3a">
    <title>Sign In | OneRoot Essentials Platform</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=static_asset_version) }}">
  </head>
  <body class="login-body">
    <main class="login-card">
      <p class="eyebrow">OneRoot Essentials</p>
      <h1>Platform Sign In</h1>
      <p class="muted">Sign in to the unified OneRoot operations workspace from any connected device.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="flash-stack">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      <form method="post" class="card form-grid single">
        <label>
          <span>Username</span>
          <input type="text" name="username" autocomplete="username" required>
        </label>
        <label>
          <span>Password</span>
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button primary" type="submit">Sign In</button>
      </form>
      <div class="form-actions" style="margin-top: 1rem;">
        <button class="button subtle" type="button" data-install-app hidden>Install App</button>
      </div>
    </main>
    <script src="/website/pwa.js?v=20260725a" defer></script>
  </body>
</html>
